        ahPb.done(); S.houses.push(h); closeModal(); switchHouse(h.id); showLanding();
        toast('Added ' + h.name + '. Drop its PDFs in Drive › HOME LAYOUT › ' + h.name + ', run Update Plans.bat, then Rescan Drive.', 7000);
      }).catch(function (e) { ahDone(); toast(errMsg(e), 5000); });
    };
  }
  $('miHouses').onclick = housesModal;
  $('miTidy').onclick = function () { call('apiTidyDatabase').catch(function () { /* shown in the activity tray */ }); };
  $('miSheet').onclick = function () { if (S.sheetUrl) window.open(S.sheetUrl, '_blank'); else toast('Sheet link not available.'); };
  $('miRescan').onclick = function () {
    if (S.rescanning) return; S.rescanning = true;
    var lf = $('lfRescan'), done = lf ? btnBusy(lf, 'Scanning') : function () {};
    call('apiRescanDrive').then(function (msg) { S.rescanning = false; done(); toast(msg.replace(/\n/g, ' · '), 6000); boot(true); })
      .catch(function () { S.rescanning = false; done(); });
  };
  $('miCache').onclick = function () { call('apiClearCaches').catch(function () { /* shown in the activity tray */ }); };
  $('btnPrint').onclick = function () { printDialog(); };
  $('miPrint').onclick = function () { closeMenus(); printDialog(); };
  $('miExport').onclick = function () { closeMenus(); exportSelections(); };
  if (window.FT_WEB) {   // GitHub app only (round 36): forget this device's sign-in
    $('miSignOut').classList.remove('hidden');
    $('miSignOut').onclick = function () { closeMenus(); window.FT_WEB.signOut(); };
  }
  // Every placed piece of the house (all floors, with its room) as a CSV the family can open in a sheet,
  // or attach in a chat with Claude to get item pictures for exactly those pieces.
  // Export my selections (round 29): writes straight into the family's export list file in Drive (EXPORT_LIST_ID);
  // without that setting, or when Drive refuses, it downloads a CSV like before.
  function exportSelections() {
    if (!S.house) return toast('Pick a house first.');
    var house = S.house;
    flush(function () {
      callAs(['Updating the export list of ' + house.name + ' in Drive', 'Export list updated'], 'apiExportToFile', [house.id]).then(function (r) {
        if (!r || !r.ok) { downloadSelections(house, r && r.reason === 'NO_EXPORT_ID' ? '' : 'The export list file could not be updated, so a copy was downloaded instead.'); return; }
        var msg = r.pieces + (r.pieces === 1 ? ' piece' : ' pieces') + ' written to “' + r.name + '”' + (r.noPic ? ' · ' + r.noPic + ' without an item picture yet' : '') +
          (r.kept && r.kept.length ? ' · kept your columns: ' + r.kept.join(', ') : '') + '.';
        toast(msg, 6000);
      }).catch(function (e) {
        downloadSelections(house, 'Could not write to the export list in Drive (' + errMsg(e) + '). A copy was downloaded instead.');
      });
    }, 'exporting');
  }
  function downloadSelections(house, note) {
    callAs(['Collecting the selections of ' + house.name, 'Selections downloaded'], 'apiExportSelections', [house.id]).then(function (rows) {
        var cell = function (v) { v = v == null ? '' : String(v); return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
        var csv = '\ufeff' + rows.map(function (r) { return r.map(cell).join(','); }).join('\r\n');
        var a = document.createElement('a'), d = new Date();
        a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
        a.download = 'Selections - ' + house.name + ' - ' + d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2) + '.csv';
        document.body.appendChild(a); a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
        var n = rows.length - 1, noPic = rows.slice(1).filter(function (r) { return r[17] === 'no'; }).length;
        toast((note ? note + ' ' : '') + n + (n === 1 ? ' piece' : ' pieces') + ' exported' + (noPic ? ' · ' + noPic + ' without an item picture yet' : '') + '.', note ? 7000 : 4500);
      }).catch(function () {});
  }
  $('miHelp').onclick = function () {
    openModal('<h3>How to use</h3><ol style="padding-left:18px;margin:0;line-height:1.6">' +
      '<li>Pick a floor at the top.</li><li>Search the Library (model, name, type, or page like <b>B015</b> = catalogue B page 15).</li>' +
      '<li>Click an item to see its catalogue page; press <b>Place on floor</b> (or double-click).</li>' +
      '<li>Drag to move; hold <b>Shift</b> to move in a straight line. Round handle rotates (snaps every 45°). <b>R</b> turns 90°.</li>' +
      '<li><b>Swap for another item…</b> (item panel) replaces a placed piece with a different one in the same spot.</li>' +
      '<li><b>Catalogue</b> (top bar) opens the catalogues page by page with the items on each page; place them from there.</li>' +
      '<li><b>Beds by mattress size</b> (top of the Library) places catalogue beds at a standard mattress size; a placed bed can switch size in its panel, with sleepers and walking space shown.</li>' +
      '<li>Mouse wheel or pinch to zoom; drag empty space to pan; <b>Fit</b> resets. ⟲ ⟳ next to the tools (or <b>Q</b> / <b>E</b>) turn the plan 90° so it matches how you stand in the room; it is remembered per floor on this device.</li>' +
      '<li><b>Measure</b>: click two points. <b>Scale</b>: click both ends of a known dimension once per floor so furniture is true size.</li>' +
      '<li><b>3/4 View</b>: an angled drawing of the floor. ⟲ ⟳ turn it, the wall menu sets how tall walls are drawn.</li>' +
      '<li><b>App Theme</b> (the grid button) chooses Paper, Blueprint or Dark.</li>' +
      '<li><b>Customise colour, material &amp; size</b> (item panel, also on a placed piece) saves a new gold <b>custom</b> item; the catalogue item is never changed. <b>Customised only</b> in the Library lists them.</li>' +
      '<li><b>♡ Favourites</b>: tap the heart on any library item to keep it in <b>My favourites</b> (only you, on any device). In the item panel, <b>Floor picks</b> shares it to a floor so everyone on that floor sees it (stamp <b>♥ PICK</b>, listed at the top of “On this floor”).</li>' +
      '<li><b>♥ My favourite picks</b> (first tab in the <b>Catalogue</b>): all your favourites as cards, sorted by type, with a jump list on the right. Hearts work on the catalogue cards too. Custom furniture you make is added automatically; tap its heart to take it off.</li>' +
      '<li><b>Custom items</b> keep their type colour on the left edge, add a second stripe in the custom colour and a gold edge; on the plan they get a corner in the type colour. In the catalogue each custom item lists what was changed (colour, material, accent, size, shape).</li>' +
      '<li><b>Undo</b> ↶ / <b>Redo</b> ↷ next to the tools (or <b>Ctrl+Z</b> / <b>Ctrl+Y</b>) step back through the last 10 changes on the floor; the list button between them shows the history, click a line to jump back to before it.</li>' +
      '<li><b>Remarks</b> (💬 <b>Remark</b> button on the plan, the <b>Remark</b> tool or key <b>N</b>): click the plan, or a piece of furniture, and write anything — a comment, what you want, a question, a to-do, a problem or an idea — as long as you like, with photos. Everyone in the house sees the pins and can reply. The <b>Remarks</b> tab (left) lists them; click one to jump to it. Drag a pin to move it (drop it on a piece to attach it; it then moves with that piece) and <b>Lock in place</b> so nobody drags it by mistake. Layers › Remarks hides the pins.</li>' +
      '<li><b>Rooms</b> (<b>Room</b> tool or key <b>O</b>, editors): click the corners of a room (or press and drag a rectangle), finish on the first corner / double-click / Enter, then name it (the drawing\'s own room names are offered). Furniture and remarks standing in a room belong to it automatically; a piece\'s panel (and a remark\'s) has a <b>Room</b> chooser to assign it to another room. Click a room\'s name to see what is in it, rename it, <b>Reshape</b> (drag corners, double-click the outline to add one) or <b>Move room</b>. <b>On this floor</b> lists furniture <b>By room</b> or <b>By type</b>.</li>' +
      '<li><b>Print (A4)</b> (printer button in the top bar, user menu, or the landing page): page 1 is the plan with rooms, numbered furniture and remark pins; then one page per room with every piece\'s picture, model, English and Chinese name, catalogue file, size and finish, plus the room\'s remarks.</li>' +
      '<li><b>Labels</b>: furniture names sit on a light pill on the plan; in the 3/4 View each piece gets a cloud label with an arrow (Layers › Furniture labels).</li>' +
      '<li>Changes save automatically a moment after you stop.</li></ol>' +
      '<p class="muted">Dashed outline = the catalogue did not print a size, so a typical size is shown. Editors can fill in real sizes from the item panel.</p>' +
      '<div class="btn-row"><button class="btn" id="mClose">Got it</button></div>');
    $('mClose').onclick = closeModal;
  };

  // ---------------- top bar wiring ----------------
  document.querySelectorAll('.tool').forEach(function (b) { b.onclick = function () { setTool(b.getAttribute('data-tool')); }; });
  $('zoomIn').onclick = function () { zoomBy(1.25); };
  $('zoomOut').onclick = function () { zoomBy(0.8); };
  $('zoomFit').onclick = function () { fitView(true); };
  $('btnLib').onclick = function () { $('sidebar').classList.toggle('open'); };
  function switchTab(name) {
    document.querySelectorAll('.tab').forEach(function (t) { t.classList.toggle('active', t.getAttribute('data-tab') === name); });
    $('tabLibrary').classList.toggle('hidden', name !== 'library');
    $('tabPlaced').classList.toggle('hidden', name !== 'placed');
    $('tabRemarks').classList.toggle('hidden', name !== 'remarks');
    if (name === 'remarks') rmRenderList();
  }
  document.querySelectorAll('.tab').forEach(function (t) { t.onclick = function () { switchTab(t.getAttribute('data-tab')); }; });

  document.addEventListener('keydown', function (e) {
    var tag = (e.target.tagName || '').toLowerCase();
    if (e.key === 'Escape' && document.querySelector('.menu.open')) { closeMenus(); return; }
    if (!$('viewer').classList.contains('hidden')) {
      if (e.key === 'Escape') return closeViewer();
      if (zvKey(e)) return;
      if (e.key === 'ArrowLeft') { e.preventDefault(); return viewerStep(-1); }
      if (e.key === 'ArrowRight') { e.preventDefault(); return viewerStep(1); }
      return;
    }
    if (tag === 'input' || tag === 'select' || tag === 'textarea') { if (e.key === 'Escape') e.target.blur(); return; }
    if (CT.open) {
      if (!$('modal').classList.contains('hidden')) { if (e.key === 'Escape' && !modalBusy()) closeModal(); return; }
      if (e.key === 'Escape') return closeCatalogue();
      if (zvKey(e)) return;
      if (e.key === 'ArrowLeft') { e.preventDefault(); return catStep(-1); }
      if (e.key === 'ArrowRight') { e.preventDefault(); return catStep(1); }
      return;
    }
    if (S.landingOpen) { if (e.key === 'Escape' && !$('modal').classList.contains('hidden') && !modalBusy()) closeModal(); return; }
    if ((e.ctrlKey || e.metaKey) && !e.altKey && $('modal').classList.contains('hidden')) {
      var kz = String(e.key).toLowerCase();
      if (kz === 'z' && !e.shiftKey) { e.preventDefault(); return undo(1); }
      if (kz === 'y' || (kz === 'z' && e.shiftKey)) { e.preventDefault(); return redo(1); }
    }
    if (e.key === 'Escape') {
      if (!$('modal').classList.contains('hidden')) return modalBusy() ? null : closeModal();
      if (CZ) return closeCustomiser();
      if (S.swapId) return endSwap();
      if (S.tool === 'room' && RD2.pts.length) { roomDrawReset(); hint('Room drawing cancelled. Click to start again, or Esc to stop.'); return; }
      if (S.roomEdit) { S.roomEdit = null; S.roomMode = ''; renderRooms(); renderInspector(); return; }
      if (S.tool !== 'select') return setTool('select');
      if (RM.sel) return rmClose();
      return selectPlacement(null);
    }
    if (S.view === 'iso') {
      if (e.key === 'ArrowLeft' || e.key === 'q' || e.key === 'Q') return $('isoLeft').click();
      if (e.key === 'ArrowRight' || e.key === 'e' || e.key === 'E') return $('isoRight').click();
      if (e.key === 'p' || e.key === 'P') return setView('plan');
      return;
    }
    if (S.tool === 'room' && RD2.pts.length) {
      if (e.key === 'Enter') { e.preventDefault(); return roomDrawClose(); }
      if (e.key === 'Backspace') { e.preventDefault(); RD2.pts.splice(-2, 2); return roomDrawPreview(null); }
    }
    if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); return deleteSel(); }
    if ((e.ctrlKey || e.metaKey) && (e.key === 'd' || e.key === 'D')) { e.preventDefault(); return duplicateSel(); }
    if (e.key === 'r' || e.key === 'R') return rotateSel(e.shiftKey ? -90 : 90);
    if (e.key === 'q' || e.key === 'Q') return turnPlan(-90);
    if (e.key === 'e' || e.key === 'E') return turnPlan(90);
    if (e.key === 'v' || e.key === 'V') return setTool('select');
    if (e.key === 'm' || e.key === 'M') return setTool('measure');
    if (e.key === 'n' || e.key === 'N') return rmStartHere();
    if ((e.key === 'o' || e.key === 'O') && canEdit()) return setTool('room');
    if (e.key === 'i' || e.key === 'I') return setView('iso');
    var step = e.shiftKey ? 10 : 1;
    var mv = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
    if (mv && S.sel) { e.preventDefault(); nudgeSel(mv[0], mv[1]); }
  });

  // ---------------- boot ----------------
  function noEmailHelp(runsAs) {
    return '<h3>One deployment setting to change</h3>' +
      '<p>Google did not tell the app who you are, so it cannot check the family list. This happens when the web app runs as its owner' +
      (runsAs ? ' (it is running as <b>' + esc(runsAs) + '</b>)' : '') + ': then only the owner can be recognised. Adding people to Members or to Drive does not change this.</p>' +
      '<p><b>The owner fixes it once</b>, in the Apps Script editor:</p><ol class="steps">' +
      '<li><b>Deploy</b> › <b>Manage deployments</b>.</li>' +
      '<li>Click the pencil ✎ on the active deployment.</li>' +
      '<li><b>Execute as</b>: <b>User accessing the web app</b>.</li>' +
      '<li><b>Who has access</b>: <b>Anyone with Google account</b>.</li>' +
      '<li>Version: <b>New version</b>, then <b>Deploy</b>. The /exec link stays the same.</li></ol>' +
      '<p><b>Then each family member</b>:</p><ol class="steps">' +
      '<li>Opens the <b>/exec</b> link (not the /dev test link).</li>' +
      '<li>Is signed in with the Google account on the family list (several accounts signed in? use a private window or the account switcher).</li>' +
      '<li>Clicks <b>Review permissions › Allow</b> once.</li>' +
      '<li>Has access to the <b>HOME LAYOUT</b> folder in Drive (the app now opens the drawings and the database sheet with their own access: Editor to edit, Viewer to look).</li></ol>' +
      '<div class="btn-row"><button class="btn" onclick="location.reload()">Reload</button></div>';
  }
  function showFatal(html) {
    loading(false); busy(false);
    var e = $('emptyState'); e.innerHTML = '<div class="box">' + html + '</div>'; e.classList.remove('hidden'); e.classList.add('fatal-open');
  }
  function loadFurniture() {
    if (!S.furniture.length) { S.furnState = 'loading'; renderLibrary(); }
    return call('apiGetFurniture').then(function (json) {
      S.furniture = JSON.parse(json || '[]'); S.furnState = 'ready';
      S.furnById = {}; S.furniture.forEach(function (f) { f.model = String(f.model); S.furnById[f.id] = f; });
      buildFilters(); if (S.bedMode) setBedMode(true); else renderLibrary();
      if (S.placements.length) renderFurniture();
      if (CT.open) { CT.byPage = null; indexCatalogue(); renderBooks(); if (CT.mode === 'fav') { renderFavGrid(); renderCatItems(); } }
      autoFavOwnCustom();
    }).catch(function () { if (!S.furniture.length) { S.furnState = 'error'; renderLibrary(); } });
  }
  // soft = refresh after Rescan Drive: no full-screen loader, stay where you are.
  function boot(soft) {
    if (!soft) loading(true, 'Unrolling the drawings');
    callAs(soft ? 'Refreshing houses and floors' : false, 'apiBootstrap', []).then(function (b) {
      if (b.error) {
        if (b.error.indexOf('NOT_MEMBER:') === 0) {
          return showFatal('<h3>Ask to be added</h3><p>You are signed in as <b>' + esc(b.error.split(':')[1]) + '</b>, which is not on the family list yet.</p>' +
            '<p>Ask the owner to add exactly this email under <b>Family members</b> (user menu). If you meant another Google account, switch account in Google and reload.</p>' +
            '<div class="btn-row"><button class="btn" onclick="location.reload()">Reload</button></div>');
        }
        if (b.error.indexOf('NO_EMAIL') === 0) return showFatal(noEmailHelp(b.error.replace(/^NO_EMAIL:?\s*/, '')));
        return showFatal('<h3>Setup needed</h3><p>' + esc(b.error) + '</p>');
      }
      S.me = b.me; S.houses = b.houses; S.floors = b.floors; S.members = b.members; S.sheetUrl = b.sheetUrl || ''; S.mainOwner = b.mainOwner || '';
      setFavData(b.favs);
      var want = S.house ? S.house.id : recall('hlp_house');
      S.house = S.houses.filter(function (h) { return h.id === want; })[0] || S.houses[0] || null;
      if (S.floor) S.floor = S.floors.filter(function (f) { return f.id === S.floor.id; })[0] || S.floor;
      applyRole(); renderHouseSelect(); renderFloorTabs(); updateTitleBlock();
      if (soft) { if (S.landingOpen) showLanding(); loadFurniture(); return; }
      loading(false);
      if (!houseFloors().length) showEmpty();
      showLanding();
      loadFurniture();
    }).catch(function (e) {
      if (soft) return;
      showFatal('<h3>Could not start</h3><p>' + esc(errMsg(e)) + '</p><div class="btn-row"><button class="btn" onclick="location.reload()">Try again</button></div>');
    });
  }
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { if (S.plan) { renderPlan(); renderFurniture(); isoLayer.batchDraw(); } });
  }
  setHover(S.showHover); setBedMode(S.bedMode); applyTheme(false); resize(); updateTitleBlock(); renderInspector(); boot();
})();
</script>
