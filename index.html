<style>
  /* Two drawing themes: "paper" (drafting/tracing paper, default) and
     "blueprint". Every colour comes from these tokens. */
  :root {
    --paper: #f1ebdc; --sheet: #fbf8f0; --sheet-2: #f6f1e4; --canvas: #ebe4d2;
    --ink: #1e2633; --pencil: #6d6a60; --rule: #ddd3be; --rule-strong: #b8ab8f;

    --font: "IBM Plex Sans", "Sarabun", "Segoe UI", sans-serif;
    --hand: "Architects Daughter", "Sarabun", "Comic Sans MS", cursive;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
    --radius: 3px;
  }
  body.blueprint {
    --paper: #0d2d54; --sheet: #113866; --sheet-2: #0f3260; --canvas: #0f3361;
    --ink: #eaf2ff; --pencil: #a3bad8; --rule: rgba(255, 255, 255, .14); --rule-strong: rgba(255, 255, 255, .32);
    --accent: #8fd3ff; --accent-ink: #0d2d54; --accent-soft: rgba(143, 211, 255, .14);
    --mark: #ffcf5a; --warn: #ffc27a; --danger: #ff9b8a;
    --grid: rgba(255, 255, 255, .06); --shadow: 0 10px 30px rgba(0, 0, 0, .35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font: 14px/1.4 var(--font); }
  body { transition: background .35s, color .35s; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .hidden { display: none !important; }
  ::selection { background: var(--accent-soft); }

  /* ---------- layout ---------- */
  .app { display: grid; height: 100vh; grid-template-rows: 54px 1fr; grid-template-columns: 300px 1fr 300px 0px;
         grid-template-areas: "top top top top" "side canvas insp cust"; transition: grid-template-columns .38s cubic-bezier(.2,.8,.2,1); }
  body.cust-open .app { grid-template-columns: 300px 1fr 300px 400px; }
  .topbar { grid-area: top; display: flex; align-items: center; gap: 8px; padding: 0 12px; min-width: 0;
            background: var(--sheet); border-bottom: 3px double var(--rule-strong); }
  .topbar > * { flex-shrink: 0; }
  .brand { display: flex; align-items: center; gap: 8px; margin-right: 4px; border: 0; background: none; padding: 2px 4px; border-radius: var(--radius); color: inherit; }
  .brand:hover { background: var(--accent-soft); }
  .brand-mark { width: 28px; height: 28px; fill: none; stroke: var(--ink); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; overflow: visible; }
  /* brand icon: draws itself on load, redraws on hover, door swings + chimney smokes while the app is working */
  .brand-mark .bm { stroke-dasharray: 100; stroke-dashoffset: 100; }
  body.ready .brand-mark .bm { animation: ink .9s ease-out forwards; }
  .brand-mark .bm-roof { animation-delay: .1s; } .brand-mark .bm-wall { animation-delay: .35s; }
  .brand-mark .bm-room { animation-delay: .6s; } .brand-mark .bm-door { animation-delay: .8s; stroke: var(--mark); }
  .brand-mark .bm-chim { animation-delay: .5s; stroke-width: 1.5; }
  .brand-mark .bm-win { fill: var(--accent); stroke: none; opacity: 0; }
  body.ready .brand-mark .bm-win { animation: winOn .4s 1.1s forwards; }
  body.ready .bm-smoke circle { animation: smokeIdle 7s ease-out 2s infinite; }
  body.ready .bm-smoke circle:nth-child(2) { animation-delay: 2.4s; } body.ready .bm-smoke circle:nth-child(3) { animation-delay: 2.8s; }
  body.ready .bm-door-g { animation: doorIdle 9s ease-in-out 3s infinite; }
  .brand-mark .bm-door-g { transform-box: view-box; transform-origin: 19px 27px; }
  .brand-mark .bm-smoke circle { fill: var(--pencil); stroke: none; opacity: 0; }
  .brand:hover .bm { animation: inkAgain .8s ease-out both; }
  .brand:hover .bm-roof { animation-delay: 0s; } .brand:hover .bm-wall { animation-delay: .15s; }
  .brand:hover .bm-room { animation-delay: .3s; } .brand:hover .bm-door { animation-delay: .4s; }
  body.ready.working .bm-door-g, body.working .bm-door-g { animation: doorSwing 1.1s ease-in-out infinite alternate; }
  body.ready.working .bm-win, body.working .bm-win { animation: winBlink 1.4s ease-in-out infinite; opacity: 1; }
  body.ready.working .bm-smoke circle, body.working .bm-smoke circle { animation: smoke 1.8s ease-out infinite; }
  body.working .bm-smoke circle:nth-child(2) { animation-delay: .5s; }
  body.working .bm-smoke circle:nth-child(3) { animation-delay: 1s; }
  @keyframes ink { to { stroke-dashoffset: 0; } }
  @keyframes smokeIdle { 0% { opacity: 0; transform: translate(0, 2px) scale(.6); } 6% { opacity: .8; } 20%, 100% { opacity: 0; transform: translate(2px, -3px) scale(1.3); } }
  @keyframes doorIdle { 0%, 88%, 100% { transform: rotate(0deg); } 93% { transform: rotate(-30deg); } }
  @keyframes inkAgain { 0% { stroke-dashoffset: 100; } 100% { stroke-dashoffset: 0; } }

  @keyframes smoke { 0% { opacity: 0; transform: translate(0, 2px) scale(.6); } 30% { opacity: .8; } 100% { opacity: 0; transform: translate(2px, -3px) scale(1.3); } }

  /* ---------- every checkbox is a drafting toggle: a little scale ruler with a compass-head knob.

  /* ---------- sidebar ---------- */

  .tab { flex: 1; border: 0; background: none; padding: 10px 6px 8px; border-bottom: 2px solid transparent; color: var(--pencil);
         font-family: var(--hand); font-size: 16px; transition: color .2s, border-color .2s; }
  .tab.active { color: var(--ink); border-bottom-color: var(--mark); }
  .tab small { font-family: var(--mono); font-size: 11px; }
  .tab-body { display: flex; flex-direction: column; gap: 8px; padding: 10px; min-height: 0; flex: 1; }
  .tab-body input[type=search] { width: 100%; border: 1px solid var(--rule-strong); border-radius: var(--radius); padding: 7px 9px; background: var(--sheet-2); }
  .filters { display: flex; gap: 6px; }
  .filters select { flex: 1; max-width: none; min-width: 0; }
  .check { display: flex; gap: 6px; align-items: center; color: var(--pencil); font-size: 13px; }
  .list { overflow-y: auto; flex: 1; margin: 0 -10px; padding: 0 10px; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 8px; cursor: pointer; border: 1px solid transparent;
         border-bottom: 1px dashed var(--rule); transition: background .15s, border-color .15s; }
  .row:hover { background: var(--sheet-2); }
  .row.sel { border: 1px solid var(--accent); background: var(--accent-soft); }
  .row .m { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .p { font: 11px var(--mono); color: var(--pencil); border: 1px solid var(--rule-strong); padding: 0 5px; align-self: start; }
  .row .s { grid-column: 1 / -1; font-size: 12px; color: var(--pencil); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .nosize { color: var(--warn); }
  .more { width: 100%; margin: 8px 0; }

  /* ---------- canvas ---------- */
  .canvas-wrap { grid-area: canvas; position: relative; overflow: hidden; background: var(--canvas); min-width: 0; transition: background .35s; }
  #stage { position: absolute; inset: 0; }
  .hint { position: absolute; left: 12px; top: 12px; background: var(--ink); color: var(--sheet); padding: 6px 10px; border-radius: var(--radius);
          font-size: 12px; pointer-events: none; max-width: 70%; }
  .hint:empty { display: none; }
  .banner { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: var(--sheet); color: var(--ink);
            border: 1px solid var(--mark); border-radius: var(--radius); padding: 8px 12px; display: flex; gap: 10px; align-items: center; box-shadow: var(--shadow); z-index: 5; }
  .banner button { border: 1px solid var(--rule-strong); background: transparent; border-radius: var(--radius); padding: 3px 8px; }
  .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--pencil); padding: 24px; }
  .empty .box { max-width: 460px; background: var(--sheet); border: 1px solid var(--rule-strong); padding: 20px; box-shadow: var(--shadow); }
  .empty h3 { font-family: var(--hand); font-weight: 400; font-size: 22px; margin: 0 0 8px; color: var(--ink); }

  /* title block, like the corner box on a drawing sheet */
  .title-block { position: absolute; right: 12px; bottom: 12px; width: 268px; background: var(--sheet); border: 1.5px solid var(--ink);
                 font-size: 11px; pointer-events: none; box-shadow: 3px 3px 0 var(--rule-strong); }
  .tb-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 8px; border-top: 1px solid var(--rule-strong); }
  .tb-row:first-child { border-top: 0; }
  .tb-head { font: 10px var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--pencil); }
  .tb-head #tbView { color: var(--mark); font-weight: 500; }
  .tb-name { font-family: var(--hand); font-size: 17px; line-height: 1.2; }
  .tb-scale { font-family: var(--mono); justify-content: flex-start; white-space: nowrap; }
  .tb-scale #tbBar { display: inline-block; height: 6px; border: 1.5px solid var(--ink); border-top: 0;
                     background: repeating-linear-gradient(90deg, var(--ink) 0 25%, transparent 25% 50%); background-size: 100% 2px; background-repeat: no-repeat; background-position: bottom; }
  .tb-meta { font: 10px var(--mono); color: var(--pencil); text-transform: uppercase; }

  .canvas-busy { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 10px; align-items: center; justify-content: center;
                 background: color-mix(in srgb, var(--canvas) 70%, transparent); backdrop-filter: blur(2px); z-index: 6; animation: fadeIn .2s; }
  .busy-text { font-family: var(--hand); font-size: 18px; color: var(--ink); }

  /* ---------- inspector ---------- */
  .inspector { grid-area: insp; background: var(--sheet); border-left: 1px solid var(--rule-strong); overflow-y: auto; position: relative; }
  .insp-body { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .insp-body > * { animation: fadeUp .25s both; }
  .insp-body h3 { margin: 0; font-family: var(--hand); font-weight: 400; font-size: 22px; line-height: 1.15; }
  .insp-body .sub { color: var(--pencil); font-size: 12px; margin-top: -6px; }
  .page-wrap { position: relative; min-height: 110px; border: 1px solid var(--rule-strong); background: var(--sheet-2); display: flex; align-items: center; justify-content: center; }
  .page-img { width: 100%; max-height: 260px; object-fit: contain; cursor: zoom-in; display: block; animation: fadeIn .3s; }
  .kv { display: grid; grid-template-columns: 78px 1fr; gap: 4px 8px; font-size: 13px; }
  .kv span:nth-child(odd) { color: var(--pencil); font: 11px var(--mono); text-transform: uppercase; padding-top: 2px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .field { display: flex; flex-direction: column; gap: 3px; font: 11px var(--mono); color: var(--pencil); text-transform: uppercase; }
  .field input, .field select { border: 1px solid var(--rule-strong); border-radius: var(--radius); padding: 5px 7px; color: var(--ink); width: 100%;
                                max-width: none; background: var(--sheet-2); font: 13px var(--font); text-transform: none; }
  .field input[type=color] { padding: 1px; height: 31px; }
  .btn { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: var(--radius); padding: 7px 12px;
         font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; transition: filter .15s, transform .1s; }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: translateY(1px); }
  .btn.sec { background: transparent; color: var(--accent); }
  .btn.danger { background: transparent; color: var(--danger); border-color: var(--danger); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .muted { color: var(--pencil); }
  .tag { display: inline-block; font: 10px var(--mono); padding: 1px 6px; border: 1px solid var(--rule-strong); color: var(--pencil); text-transform: uppercase; }
  .tag.warn { border-color: var(--warn); color: var(--warn); }
  details summary { cursor: pointer; font: 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; }

  /* ---------- modal / toast ---------- */
  .modal { position: fixed; inset: 0; background: rgba(20, 18, 12, .45); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; animation: fadeIn .15s; }
  .modal-card { background: var(--sheet); border: 1.5px solid var(--ink); box-shadow: 6px 6px 0 var(--rule-strong); width: min(520px, 100%);
                max-height: 90vh; overflow: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; animation: popIn .2s; }
  .modal-card.wide { width: min(1100px, 100%); }
  .modal-card h3 { margin: 0; font-family: var(--hand); font-weight: 400; font-size: 22px; }
  .modal-card .big-img { width: 100%; height: auto; }
  .member-row { display: grid; grid-template-columns: 1fr 110px 32px; gap: 6px; align-items: center; padding: 4px 0; border-bottom: 1px dashed var(--rule); }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--sheet); padding: 8px 14px;
           border-radius: var(--radius); z-index: 60; max-width: 90vw; animation: slideUp .2s; }

  /* ---------- loading: a little plan drawing itself ---------- */
  .loading { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center; z-index: 70;
             background-color: var(--paper);
             background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
             background-size: 24px 24px; transition: opacity .35s, visibility .35s; }
  .loading.hidden { display: flex !important; opacity: 0; visibility: hidden; pointer-events: none; }
  .draft-loader svg { width: 160px; height: 120px; overflow: visible; }
  .draft-loader.small svg { width: 110px; height: 82px; }
  .dl { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
        stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw 2.6s ease-in-out infinite; }
  .dl1 { stroke-width: 3; }
  .dl2 { animation-delay: .25s; } .dl3 { animation-delay: .45s; }
  .dl4 { stroke: var(--mark); stroke-width: 1.6; animation-delay: .65s; }
  .dl5 { stroke: var(--accent); stroke-width: 1.4; animation-delay: .85s; }
  .dl6 { stroke: var(--pencil); stroke-width: 1; animation-delay: 1.05s; }
  .dl-pen { fill: var(--mark); }
  .loading-text { font-family: var(--hand); font-size: 20px; color: var(--ink); }
  .dots i { font-style: normal; animation: blink 1.2s infinite; }
  .dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
  .loading .err-box { max-width: 440px; text-align: center; padding: 16px; background: var(--sheet); border: 1.5px solid var(--ink); }

  .mini-draw { width: 34px; height: 34px; }
  .mini-draw circle { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 100; animation: draw 1.4s ease-in-out infinite; transform-origin: center; }
  .mini-draw line { stroke: var(--mark); stroke-width: 2; stroke-linecap: round; transform-origin: 20px 20px; animation: spin 1.4s linear infinite; }

  @keyframes draw { 0% { stroke-dashoffset: 100; opacity: 1; } 45% { stroke-dashoffset: 0; } 80% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
  @keyframes blink { 0%, 100% { opacity: .15; } 50% { opacity: 1; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @keyframes popIn { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }
  @keyframes slideUp { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
  /* Reduced motion: only the big moves are toned down; the small drafting animations stay. */
  @media (prefers-reduced-motion: reduce) {
    .modal-card, .toast, .insp-body > * { animation: none !important; }
  }

  /* ---------- houses, members, sign-in help ---------- */
  .lh-label { font: 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--pencil); align-self: center; margin-right: 4px; }
  .landing-houses .own-tag { font: 9px var(--mono); text-transform: uppercase; opacity: .75; margin-left: 3px; }
  .landing-houses .add-house { border-style: dashed; color: var(--accent); }
  .landing-houses .ghost { border-color: transparent; color: var(--accent); text-decoration: underline dotted; text-underline-offset: 3px; }
  .house-row { display: grid; grid-template-columns: 1fr 1.4fr; gap: 6px 10px; padding: 10px 0; border-bottom: 1px dashed var(--rule); }
  .house-meta { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; font: 11px var(--mono); color: var(--pencil); }
  .house-meta span { flex: 1; }
  .role-help { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--pencil); border: 1px dashed var(--rule-strong); padding: 6px 10px; }
  .main-tag { border-color: var(--mark); color: var(--mark); vertical-align: 1px; }
  .add-member { display: grid; grid-template-columns: 1.6fr 1fr 1fr auto; gap: 6px; align-items: end; }
  .member-row select:disabled { opacity: .7; }
  .empty.fatal-open { overflow: auto; align-items: flex-start; }
  .empty .box ol.steps { text-align: left; margin: 4px 0 10px; padding-left: 20px; line-height: 1.55; color: var(--ink); font-size: 13px; }
  .empty .box p { text-align: left; font-size: 13px; }
  .empty .box .btn-row { justify-content: center; }
  @media (max-width: 600px) { .house-row, .add-member { grid-template-columns: 1fr; } }

  /* ---------- swap mode ---------- */
  .swap-bar { display: flex; gap: 8px; align-items: center; border: 1.5px dashed var(--mark); background: var(--sheet); padding: 8px 10px; font-size: 12px; color: var(--ink);
              animation: swapPulse 1.6s ease-in-out infinite; }
  .swap-bar > div { flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .swap-bar b { color: var(--mark); }
  @keyframes swapPulse { 50% { border-color: var(--rule-strong); } }
  .swap-btn { width: 100%; border-style: dashed; }
  body.swapping #libList .row:hover, body.swapping .bed-card:hover { outline: 1.5px dashed var(--mark); outline-offset: -2px; }

  /* ---------- bed size presets ---------- */
  .lib-mode { display: flex; align-items: center; justify-content: space-between; gap: 6px; border-bottom: 1px dashed var(--rule); padding-bottom: 8px; }
  .guide-btn { display: inline-flex; align-items: center; gap: 5px; }
  .guide-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.4; }
  #libCatalogue { display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; }
  #libCatalogue.hidden { display: none; }
  .bed-presets { overflow-y: auto; flex: 1; margin: 0 -10px; padding: 0 10px; display: flex; flex-direction: column; gap: 6px; }
  .bp-intro { font-size: 12px; margin: 0 0 2px; }
  .bed-card { display: grid; grid-template-columns: 88px 1fr; gap: 10px; align-items: end; padding: 8px; border: 1px solid var(--rule); background: var(--sheet); cursor: pointer;
              transition: border-color .15s, transform .15s; animation: cardIn .3s both; }
  .bed-card:hover { border-color: var(--rule-strong); transform: translateY(-1px); }
  .bed-card.sel { border-color: var(--accent); background: var(--accent-soft); }
  .bed-card .bc-draw { display: flex; align-items: flex-end; justify-content: center; min-height: 40px; }
  .bc-txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .bc-txt .m { font-family: var(--hand); font-size: 16px; line-height: 1.1; }
  .bc-txt .sz { font: 11px var(--mono); color: var(--pencil); }
  .bc-txt .ft { font-size: 12px; color: var(--ink); display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .fit-ic { display: inline-flex; gap: 1px; align-items: flex-end; }
  .fit-ic svg { width: 9px; height: 17px; fill: none; stroke: var(--accent); stroke-width: 1.3; stroke-linecap: round; }
  .fit-ic svg.fi-P { width: 12px; stroke: var(--warn); }
  .fit-ic svg.fi-C, .fit-ic svg.fi-B { stroke: var(--mark); }
  .bed-svg { overflow: visible; display: block; }
  .bed-svg * { vector-effect: non-scaling-stroke; }
  .bs-grid { stroke: var(--grid); stroke-width: 1; }
  .bs-mat { fill: var(--sheet-2); stroke: var(--ink); stroke-width: 1.3; }
  .bs-pil { fill: var(--sheet); stroke: var(--pencil); stroke-width: .8; }
  .bs-quilt { fill: var(--accent-soft); stroke: var(--accent); stroke-width: .8; }
  .bs-body { fill: var(--accent-soft); stroke: var(--accent); stroke-width: .9; stroke-dasharray: 3 2; }
  .bs-body.bs-C, .bs-body.bs-B { stroke: var(--mark); }
  .bs-head { fill: #e8c4a0; stroke: var(--ink); stroke-width: .9; }
  .bs-hair { fill: none; stroke: #5a3d2b; stroke-width: 2.2; stroke-linecap: round; }
  .bs-pet { fill: #c9a37c; stroke: var(--ink); stroke-width: .8; }
  .bs-pet-l { fill: none; stroke: var(--ink); stroke-width: .8; }
  body.blueprint .bs-head { fill: rgba(255, 231, 168, .55); }
  body.blueprint .bs-hair { stroke: #ffe7a8; }
  body.blueprint .bs-pet { fill: rgba(255, 194, 122, .45); }
  .preset-view { display: flex; justify-content: center; padding: 10px; background: var(--sheet-2); border: 1px solid var(--rule); }
  .preset-fit { display: flex; gap: 6px; align-items: center; font-size: 13px; }
  .preset-note { margin: 0; font-size: 13px; color: var(--ink); }
  .modal-card.guide { gap: 10px; }
  .guide-legend { display: flex; gap: 8px; align-items: center; font: 11px var(--mono); color: var(--pencil); }
  .guide-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; align-items: end; }
  .guide-card { display: flex; flex-direction: column; gap: 3px; padding: 10px; border: 1px solid var(--rule); background: var(--sheet-2); height: 100%; animation: cardIn .35s both; }
  .guide-card .gc-draw { display: flex; align-items: flex-end; justify-content: center; min-height: 176px; margin-bottom: 6px; }
  .gc-name { font-family: var(--hand); font-size: 18px; }
  .gc-size { font: 11px var(--mono); color: var(--pencil); }
  .gc-fit { font-size: 12px; display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
  .gc-note { font-size: 12px; color: var(--pencil); flex: 1; }
  .gc-place { margin-top: 6px; align-self: flex-start; }

  /* ---------- progress in place: activity tray, busy buttons, inline loaders ---------- */
  /* Loading / saving boxes: under the top bar, centred over the plan (left is set by placeActivity()), stacking downwards. */
  .activity { position: fixed; left: 50%; top: 62px; z-index: 65; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px;
              pointer-events: none; max-width: min(460px, calc(100vw - 24px)); transition: left .3s cubic-bezier(.2,.8,.2,1); }
  .activity .act { max-width: 100%; min-width: 250px; }
  .hint { top: calc(12px + var(--act-h, 0px)); transition: top .2s; }
  .banner { top: calc(12px + var(--act-h, 0px)); transition: top .2s; }
  .act { display: flex; align-items: center; gap: 8px; background: var(--sheet); color: var(--ink); border: 1px solid var(--rule-strong); border-left: 3px solid var(--accent);
         box-shadow: 3px 3px 0 var(--rule); padding: 6px 12px 6px 8px; font-size: 12px; animation: actIn .22s ease-out; transition: opacity .25s, transform .25s; }
  .act.slow { border-left-color: var(--warn); }
  .act.done { border-left-color: #3f8a5a; }
  .act.err { border-left-color: var(--danger); color: var(--danger); }
  .act.out { opacity: 0; transform: translateY(-8px) scale(.97); }
  .act-spin { width: 20px; height: 20px; flex: none; }
  .act-spin circle { fill: none; stroke: var(--accent); stroke-width: 3; stroke-dasharray: 100; animation: draw 1.4s ease-in-out infinite; }
  .act-spin line { stroke: var(--mark); stroke-width: 3; stroke-linecap: round; transform-origin: 20px 20px; animation: spin 1.4s linear infinite; }
  .act-i { width: 20px; height: 20px; flex: none; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; font: 700 12px var(--mono);
           border: 1.5px solid currentColor; color: #3f8a5a; }
  .act.err .act-i { color: var(--danger); }
  @keyframes actIn { from { opacity: 0; transform: translateY(-10px); } }
  .btn-spin { display: inline-block; width: 10px; height: 10px; border: 1.6px solid currentColor; border-right-color: transparent; border-radius: 50%;
              animation: spin .75s linear infinite; margin-right: 6px; vertical-align: -1px; flex: none; }
  .is-busy { cursor: progress !important; }
  .btn.is-busy, .floor-tab.is-loading { opacity: .85; }
  select.is-busy { opacity: .6; }
  .member-row.is-busy { opacity: .5; }
  .inline-load { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 18px 8px; color: var(--pencil); font-family: var(--hand); font-size: 16px; text-align: center; }
  .inline-load .mini-draw { width: 28px; height: 28px; flex: none; }
  .inline-load.err { flex-direction: column; color: var(--danger); font-family: var(--font); font-size: 13px; }
  .page-wrap .inline-load { min-height: 140px; }
  .save-state { cursor: default; }
  .save-state.saving::before { content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 6px; vertical-align: -1px; border: 1.5px solid currentColor;
                               border-right-color: transparent; border-radius: 50%; animation: spin .75s linear infinite; }
  .save-state.dirty::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; background: var(--warn); animation: dotPulse 1.2s ease-in-out infinite; }
  .save-state.ok::before { content: "✓ "; color: #3f8a5a; }
  .save-state.err { cursor: pointer; text-decoration: underline dotted; }
  @keyframes dotPulse { 50% { opacity: .3; } }
  .sheet-card .tb-l .mt .btn-spin { width: 8px; height: 8px; }


  /* ---------- beds by mattress size ---------- */
  .bed-bar { display: flex; flex-direction: column; gap: 6px; padding: 8px; border: 1px dashed var(--accent); background: var(--accent-soft); }
  .bed-bar.hidden { display: none; }
  .bb-fit { display: flex; gap: 10px; align-items: flex-end; font-size: 12px; }
  .bb-fit small { color: var(--pencil); }
  .bb-note { margin: 0; font-size: 12px; }
  .row .rs { color: var(--accent); font-weight: 600; }
  .bed-size-box { border: 1px solid var(--rule-strong); background: var(--sheet-2); padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; font-size: 12px; }
  .bsb-head { font: 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--pencil); }
  .bsb-row { display: flex; gap: 10px; align-items: flex-end; }
  .bsb-txt { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .bsb-txt small { color: var(--pencil); }
  .bsb-frame { font: 11px var(--mono); color: var(--ink); }
  .fs-frame { fill: var(--sheet); stroke: var(--ink); stroke-width: 1.3; }
  .fs-head { fill: var(--pencil); opacity: .55; }

  .walk { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }

  /* ---------- building renders: landing banner + full-screen viewer ---------- */
  .render-hero { display: grid; grid-template-columns: 1fr 150px; gap: 14px; margin-top: 18px; animation: czRise .5s both; }
  .rh-load { grid-column: 1 / -1; padding: 22px; border: 1px dashed var(--rule-strong); }
  .rh-stage { position: relative; height: clamp(240px, 42vh, 460px); overflow: hidden; border: 1.5px solid var(--ink); background: var(--sheet-2); }
  .rh-slide { position: absolute; inset: 0; opacity: 0; transition: opacity 1s ease; }
  .rh-slide.on { opacity: 1; z-index: 1; }
  .rh-img { position: absolute; inset: -2%; background: center / cover no-repeat; cursor: zoom-in; transition: filter .8s ease; }
  .rh-img.blur { filter: blur(10px) saturate(.9); }
  .rh-img.sharp { filter: none; }
  .rh-slide.on .rh-img { animation: kenBurns 14s ease-in-out infinite alternate; }
  /* round 17: each render starts at a random part (top / middle / bottom) and pans to another; the frame keeps its last
     position while it fades out, so nothing jumps */
  .rh-img.panning, .rh-slide.on .rh-img.panning { animation: rhPan 8.5s cubic-bezier(.45, .05, .35, 1) both; }
  @keyframes rhPan { from { background-position: var(--p0, 50% 50%); transform: scale(var(--s0, 1.03)); }
                     to { background-position: var(--p1, 50% 50%); transform: scale(var(--s1, 1.1)); } }
  .rh-finder { position: absolute; left: 12px; top: 12px; z-index: 4; display: flex; flex-direction: column; gap: 4px; pointer-events: none;
               padding: 5px; background: rgba(10, 14, 22, .55); border: 1px solid rgba(255,255,255,.35); backdrop-filter: blur(2px); }
  .rf-map { position: relative; background: #556 center / 100% 100% no-repeat; opacity: .9; outline: 1px solid rgba(255,255,255,.25); }
  .rf-frame { position: absolute; left: var(--l0, 0); top: var(--t0, 0); border: 1.5px solid #ffd76a; box-shadow: 0 0 0 999px rgba(10,14,22,.35);
              border-radius: 1px; }
  .rf-map { overflow: hidden; }
  .rf-frame.panning { animation: rfPan 8.5s cubic-bezier(.45, .05, .35, 1) both; }
  @keyframes rfPan { from { left: var(--l0); top: var(--t0); } to { left: var(--l1); top: var(--t1); } }
  .rf-lbl { font: 9px/1.25 var(--mono); color: #fff; text-transform: uppercase; letter-spacing: .04em; white-space: normal; text-align: center; }
  .rh-finder { align-items: center; box-sizing: border-box; }
  @media (max-width: 860px) { .rh-finder { transform: scale(.82); transform-origin: top left; } }
  @keyframes kenBurns { from { transform: scale(1) translate(0, 0); } to { transform: scale(1.08) translate(-1.5%, -1%); } }
  .rh-cap { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; padding: 26px 16px 12px; pointer-events: none;
            background: linear-gradient(transparent, rgba(10, 14, 22, .72)); color: #fff; display: flex; flex-direction: column; }
  .rh-cap .eyebrow { color: rgba(255,255,255,.75); }
  .rh-cap b { font: 20px var(--hand); text-transform: capitalize; }
  .rh-nav { position: absolute; top: 50%; z-index: 3; width: 38px; height: 38px; margin-top: -19px; border-radius: 50%; border: 0; font-size: 26px; line-height: 1;
            background: rgba(255,255,255,.82); color: #1e2633; opacity: .0; transition: opacity .2s; }
  .rh-stage:hover .rh-nav, .rh-nav:focus-visible { opacity: 1; }
  .rh-nav.prev { left: 10px; } .rh-nav.next { right: 10px; }
  .rh-dots { position: absolute; right: 14px; bottom: 14px; z-index: 4; display: flex; gap: 6px; }
  .rh-dots button { width: 9px; height: 9px; padding: 0; border-radius: 50%; border: 1px solid #fff; background: transparent; transition: width .25s, background .25s; }
  .rh-dots button.on { width: 22px; border-radius: 5px; background: #fff; }
  .rh-open { position: absolute; top: 10px; right: 10px; z-index: 4; border: 0; padding: 5px 10px; font: 11px var(--mono); text-transform: uppercase;
             background: rgba(255,255,255,.86); color: #1e2633; border-radius: var(--radius); }
  .rh-stack { display: flex; flex-direction: column; gap: 3px; padding: 8px; border: 1.5px solid var(--ink); background: var(--sheet); overflow-y: auto; max-height: clamp(240px, 42vh, 460px); }
  .rh-stack-h { font: 10px var(--mono); text-transform: uppercase; color: var(--pencil); text-align: center; margin-bottom: 2px; }
  .rhs-cap { height: 10px; margin: 0 12px; border: 1.5px solid var(--rule-strong); border-bottom: 0; }
  .rhs-floor { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid var(--rule-strong); background: var(--sheet-2); font-size: 12px; text-align: left;
               transition: background .15s, transform .15s; }
  .rhs-floor .lv { font: 600 12px var(--mono); color: var(--accent); width: 18px; }
  .rhs-floor .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rhs-floor:hover { background: var(--accent-soft); transform: translateX(-3px); }
  .rhs-ground { text-align: center; font: 10px var(--mono); color: var(--pencil); border-top: 3px double var(--rule-strong); padding-top: 3px; }
  .viewer { position: fixed; inset: 0; z-index: 60; background: rgba(8, 12, 20, .94); display: flex; flex-direction: column; opacity: 0; transition: opacity .25s; }
  .viewer.show { opacity: 1; }
  .vw-head { display: flex; align-items: center; gap: 12px; padding: 10px 14px; color: #e8eef8; }
  .vw-title { font: 18px var(--hand); text-transform: capitalize; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vw-hint { font: 11px var(--mono); color: #9fb0c8; }
  .vw-head .icon-btn { color: #fff; font-size: 24px; }
  .vw-body { flex: 1; min-height: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; padding: 0 60px 20px; color: #e8eef8; }
  .vw-body.zoom { overflow: auto; display: block; padding: 0; cursor: grab; }
  .vw-body.zoom:active { cursor: grabbing; }
  .vw-img { max-width: 100%; max-height: 100%; object-fit: contain; cursor: zoom-in; box-shadow: 0 20px 60px rgba(0,0,0,.5); user-select: none; transition: filter .6s; }
  .vw-img.blur { filter: blur(8px); }
  .vw-body.zoom .vw-img { max-width: none; max-height: none; cursor: inherit; }
  .vw-nav { position: absolute; top: 50%; z-index: 2; width: 44px; height: 44px; margin-top: -22px; border-radius: 50%; border: 0; font-size: 30px; line-height: 1;
            background: rgba(255,255,255,.14); color: #fff; }
  .vw-nav:hover { background: rgba(255,255,255,.3); }
  .vw-prev { left: 10px; } .vw-next { right: 10px; }
  @media (max-width: 860px) {
    .cust-panel { position: fixed; left: 0; right: 0; bottom: 0; top: 54px; z-index: 32; padding: 14px 14px 22px 22px; }
    body.cust-open .app { grid-template-columns: 1fr; }
    .render-hero { grid-template-columns: 1fr; }
    .rh-stack { flex-direction: row; flex-wrap: wrap; max-height: none; } .rhs-cap, .rhs-ground, .rh-stack-h { display: none; }
    .rhs-floor { flex: 1 1 120px; }
    .vw-body { padding: 0 8px 12px; } .vw-hint { display: none; }
    .rh-nav { opacity: 1; }
  }

  /* ---------- furniture loader (chair -> bed -> sofa) + panel busy overlay ---------- */
  .furn-morph { width: 58px; height: 46px; overflow: visible; color: var(--accent); flex: none; }
  .furn-morph .fm { fill: var(--accent-soft); stroke: currentColor; stroke-width: 1.9; stroke-linejoin: round; stroke-linecap: round;
                    transform-box: view-box; transform-origin: 30px 36px; opacity: 0; animation: fmCycle 4.2s cubic-bezier(.45,.05,.4,1) infinite both; }
  .furn-morph .fm-bed { animation-delay: 1.4s; }
  .furn-morph .fm-sofa { animation-delay: 2.8s; }
  .furn-morph .fm-shadow { fill: currentColor; opacity: .16; transform-box: fill-box; transform-origin: center; animation: fmShadow 1.4s ease-in-out infinite; }
  @keyframes fmCycle {
    0% { opacity: 0; transform: scale(.3) rotate(-50deg); }
    6% { opacity: 1; transform: scale(1.12) rotate(16deg); }
    12% { transform: scale(.96) rotate(-12deg); }
    18% { transform: scale(1.02) rotate(8deg); }
    24% { transform: scale(1) rotate(-3deg); }
    28% { opacity: 1; transform: scale(1) rotate(0deg); }
    33.3% { opacity: 0; transform: scale(.3) rotate(50deg); }
    100% { opacity: 0; transform: scale(.3) rotate(50deg); }
  }
  @keyframes fmShadow { 0%, 100% { transform: scaleX(.55); opacity: .1; } 45% { transform: scaleX(1); opacity: .2; } }
  .furn-morph.mini { width: 24px; height: 19px; }
  .furn-morph.mini .fm { stroke-width: 3.4; }
  .furn-morph.mini .fm-shadow { display: none; }
  .act-furn .furn-morph { color: var(--accent); }
  .inline-load.furn { flex-direction: column; gap: 6px; }
  .inline-load.furn .furn-morph { width: 58px; height: 46px; }
  .is-panel-busy { overflow: hidden !important; }
  .modal-card { position: relative; }
  .panel-busy { position: absolute; left: 0; right: 0; top: 0; height: 100%; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center;
                gap: 8px; padding: 24px; text-align: center; cursor: progress; user-select: none;
                background: color-mix(in srgb, var(--sheet) 86%, transparent); backdrop-filter: blur(2px); animation: fadeIn .18s both; }
  .panel-busy .furn-morph { width: 92px; height: 74px; }
  .panel-busy .pb-draft .mini-draw { width: 54px; height: 54px; }
  .pb-t { font: 22px/1.2 var(--hand); color: var(--ink); }
  .pb-s { font-size: 13px; color: var(--pencil); max-width: 300px; min-height: 1.4em; }
  .pb-bar { width: 160px; height: 3px; margin-top: 4px; background: var(--rule); overflow: hidden; border-radius: 2px; }
  .pb-bar i { display: block; width: 40%; height: 100%; background: var(--accent); animation: pbSlide 1.2s ease-in-out infinite; }
  @keyframes pbSlide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  .panel-busy.slow .pb-s { color: var(--warn); }
  .panel-busy.ok .furn-morph .fm, .panel-busy.ok .pb-bar, .panel-busy.ok .pb-draft, .panel-busy.ok .pb-note { display: none; }
  .panel-busy.ok::before { content: "✓"; display: grid; place-items: center; width: 56px; height: 56px; border-radius: 50%; font-size: 30px;
                           color: var(--accent-ink); background: var(--accent); animation: popIn .3s cubic-bezier(.3,1.6,.5,1) both; }
  .panel-busy.ok .furn-morph { display: none; }

  /* ---------- favourites: architect heart badge, floor picks ---------- */
  :root { --fav: #c0392b; --fav-hatch: rgba(255, 255, 255, .55); --fav-soft: rgba(192, 57, 43, .1); }
  body.blueprint { --fav: #ff8fa3; --fav-hatch: rgba(13, 45, 84, .45); --fav-soft: rgba(255, 143, 163, .14); }
  .heart { width: 18px; height: 18px; flex: none; overflow: visible; color: var(--pencil); --h-fill: none; --h-ln: currentColor; --h-sk: currentColor; --h-cx: currentColor; --h-cxo: 0; }
  .heart.on, .heart.pick { color: var(--fav); --h-fill: url(#favHatch); --h-cxo: .5; }
  .heart.pick { --h-w: 1.4; }
  .row.has-fav { position: relative; }
  .row.has-fav .s { padding-right: 24px; }
  .fav-btn { position: absolute; right: 4px; bottom: 3px; width: 26px; height: 24px; padding: 0; border: 0; background: none; border-radius: 50%;
             display: grid; place-items: center; cursor: pointer; opacity: .28; transition: opacity .15s, transform .15s, background .15s; }
  .row:hover .fav-btn, .fav-btn:focus-visible { opacity: .85; }
  .fav-btn:hover { background: var(--fav-soft); transform: scale(1.12); }
  .fav-btn.on { opacity: 1; }
  .fav-btn .heart { width: 17px; height: 17px; }
  .kick .heart, .fav-big.kick .heart { animation: heartKick .55s cubic-bezier(.3,1.7,.5,1); }
  @keyframes heartKick { 0% { transform: scale(.4) rotate(-20deg); } 45% { transform: scale(1.35) rotate(8deg); } 70% { transform: scale(.92) rotate(-3deg); } 100% { transform: none; } }
  .pick-stamp { position: absolute; right: 32px; bottom: 6px; display: inline-flex; align-items: center; gap: 2px; padding: 0 4px 0 2px; border: 1px solid var(--fav);
                color: var(--fav); font: 600 9px/14px var(--mono); text-transform: uppercase; letter-spacing: .06em; transform: rotate(-4deg); background: var(--sheet);
                box-shadow: 1px 1px 0 var(--fav-soft); }
  .pick-stamp .heart { width: 11px; height: 11px; }
  .row.has-fav:has(.pick-stamp) .s { padding-right: 80px; }
  .fav-seg { display: flex; gap: 0; margin: 4px 0 8px; border: 1px solid var(--rule-strong); border-radius: var(--radius); overflow: hidden; }
  .fav-seg button { flex: 1 1 auto; display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 5px 6px; border: 0; background: none; font-size: 11.5px;
                    color: var(--pencil); white-space: nowrap; }
  .fav-seg button + button { border-left: 1px solid var(--rule); }
  .fav-seg button:hover { background: var(--accent-soft); }
  .fav-seg button.on { background: var(--fav-soft); color: var(--ink); font-weight: 600; box-shadow: inset 0 -2px 0 var(--fav); }
  .fav-seg button[data-fv=""].on { background: var(--accent-soft); box-shadow: inset 0 -2px 0 var(--accent); }
  .fav-seg .heart { width: 14px; height: 14px; }
  .fav-seg b { font: 600 10px var(--mono); color: var(--fav); }
  .fav-empty { padding: 10px 6px; }
  .fav-box { margin: 8px 0 10px; }
  .fav-big { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; text-align: left; border: 1px dashed var(--rule-strong); background: none;
             border-radius: var(--radius); color: var(--ink); cursor: pointer; transition: background .15s, border-color .15s; }
  .fav-big .heart { width: 26px; height: 26px; }
  .fav-big span { display: flex; flex-direction: column; line-height: 1.25; }
  .fav-big b { font-weight: 600; font-size: 13px; }
  .fav-big small { font-size: 11px; color: var(--pencil); }
  .fav-big:hover { border-color: var(--fav); background: var(--fav-soft); }
  .fav-big.on { border-style: solid; border-color: var(--fav); background: var(--fav-soft); }
  .fav-floors { margin-top: 6px; padding: 6px 8px; border: 1px solid var(--rule); background: var(--sheet-2); }
  .fav-h { display: flex; align-items: center; gap: 5px; font: 11px var(--mono); text-transform: uppercase; color: var(--pencil); margin-bottom: 4px; }
  .fav-h small { text-transform: none; font-family: var(--font); }
  .fav-h .heart { width: 14px; height: 14px; }
  .fav-fl { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 2px 8px; padding: 3px 0; font-size: 12.5px; color: var(--ink); }
  .fav-fl small { grid-column: 2; font-size: 11px; color: var(--fav); margin-top: -2px; }
  .fav-fl em { font-style: normal; font: 9.5px var(--mono); text-transform: uppercase; color: var(--accent); margin-left: 4px; }
  .fav-fl.ro { grid-template-columns: 16px 1fr auto; }
  .fav-fl.ro .heart { width: 14px; height: 14px; } .fav-fl.ro small { grid-column: auto; margin: 0; }
  .fav-fl.is-busy { opacity: .6; }
  .fav-fl input[type=checkbox]:checked { border-color: var(--fav); background-image: repeating-linear-gradient(-45deg, var(--fav) 0 1.4px, transparent 1.4px 5px); }
  .picks-head .heart { width: 14px; height: 14px; margin-right: 2px; }
  .pick-row { background: linear-gradient(90deg, var(--fav-soft), transparent 60%); }
  .pick-row .p { font-size: 10px; }
  .placed-n { color: var(--accent); }
  .picks-sep { height: 10px; border-bottom: 2px dashed var(--rule); margin-bottom: 10px; }
  .tb-picks { display: inline-flex; align-items: center; gap: 3px; color: var(--fav); }
  .tb-picks .heart { width: 12px; height: 12px; }
  /* ---------- round 16: custom = type colour + custom colour; My favourite picks in the catalogue ---------- */
  .row.custom { padding-left: 14px; background: linear-gradient(90deg, transparent 55%, var(--custom-soft));
                box-shadow: inset 4px 0 0 var(--tc), inset 7px 0 0 var(--cc, var(--custom)), inset -3px 0 0 var(--custom); }
  .row.custom.sel { background: var(--accent-soft); box-shadow: inset 4px 0 0 var(--tc), inset 7px 0 0 var(--cc, var(--custom)), inset -3px 0 0 var(--custom), 0 0 0 1px var(--accent); }
  .ci-card { position: relative; }

                    background: linear-gradient(90deg, var(--sheet) 55%, var(--custom-soft)); }

  .czd-h { font: 10px var(--mono); text-transform: uppercase; letter-spacing: .05em; color: var(--custom); margin-bottom: 1px; }
  .czd-r { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 6px; align-items: baseline; }
  .czd-k { font: 10.5px var(--mono); color: var(--pencil); }
  .czd-v { display: flex; flex-wrap: wrap; align-items: center; gap: 0 6px; color: var(--ink); min-width: 0; overflow-wrap: anywhere; }
  .czd-v .fin { min-width: 0; white-space: normal; }
  .czd-v small { flex-basis: 100%; font-size: 10.5px; color: var(--pencil); }
  .cz-diff.compact { padding: 4px 6px; font-size: 11.5px; }
  .cz-diff.compact .czd-r { grid-template-columns: 52px minmax(0, 1fr); }

  .fav-book .cb-letter { display: grid; place-items: center; }
  .fav-book .cb-letter .heart { width: 24px; height: 24px; transition: transform .2s; }
  .fav-book:hover .cb-letter .heart { transform: scale(1.12) rotate(-6deg); }
  .fav-book { background: linear-gradient(135deg, var(--fav-soft), var(--sheet) 70%); }
  .fav-book .cb-meta { color: var(--fav); opacity: 1; }
  .fav-book.active { background: var(--fav); border-color: var(--fav); color: #fff; }

  .fav-book.active .cb-meta { color: #fff; }
  body.blueprint .fav-book.active { color: #0d2d54; } body.blueprint .fav-book.active .heart, body.blueprint .fav-book.active .cb-meta { color: #0d2d54; }

  .note-anim .na-l { fill: none; stroke: var(--accent-ink); stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 10; stroke-dashoffset: 10; animation: naWrite 2.2s linear infinite; }
  .note-anim .na-l2 { animation-delay: .35s; } .note-anim .na-l3 { animation-delay: .7s; }
  @keyframes naBob { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-5px) scale(1.05, .97); } }
  @keyframes naShadow { 0%, 100% { transform: scale(1); opacity: .2; } 50% { transform: scale(.7); opacity: .1; } }
  @keyframes naWrite { 0% { stroke-dashoffset: 10; } 40%, 80% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -10; } }
  .panel-busy .pb-note { display: block; }

  /* ---------- one typeface: Sarabun ExtraBold everywhere (easy to read on screens and phones) ---------- */
  :root { --font: "Sarabun", "Segoe UI", sans-serif; --hand: "Sarabun", "Segoe UI", sans-serif; --mono: "Sarabun", "Segoe UI", sans-serif; }
  html, body { font-family: var(--font); }
  *, *::before, *::after { font-weight: 800 !important; }
  button, input, select, textarea, svg text { font-family: var(--font); }
  .save-state, .sheet-no, .tb-scale, .zv-read, .rm-fchip b, .hist-item .hi-t { font-variant-numeric: tabular-nums; }
  .eyebrow, .sheet-no, .menu-sub, .tb-head { letter-spacing: .06em; }
  :root { --styles-build: "r19"; }

  /* ---------- rooms ---------- */
  .tag-dot.rooms { height: 10px; width: 14px; border: 2px dashed #d9822b; background: rgba(217, 130, 43, .15); }
  .placed-bar { display: flex; align-items: center; gap: 6px; margin: 2px 0 6px; }
  .seg-mini { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 999px; overflow: hidden; }
  .seg-mini button { border: 0; background: transparent; color: var(--pencil); padding: 4px 11px; font-size: 13px; cursor: pointer; transition: background .2s, color .2s; }
  .seg-mini button.on { background: var(--accent); color: var(--accent-ink); }
  .room-new-btn { margin-left: auto; font-size: 13px; color: var(--accent); }
  .room-grp { cursor: pointer; border-radius: 4px; }
  .room-grp .rg-dot { width: 12px; height: 12px; border-radius: 3px; border: 2px dashed var(--tc); background: color-mix(in srgb, var(--tc) 22%, transparent); }
  .room-grp small { color: var(--pencil); font-size: 11px; }
  .room-grp:hover, .room-grp.sel { background: var(--accent-soft); }
  .room-empty { font-size: 12px; color: var(--pencil); padding: 2px 10px 8px 22px; }
  .room-hint { font-size: 13px; }
  .room-head { display: flex; gap: 10px; align-items: center; }
  .room-dot { width: 34px; height: 34px; flex: none; border-radius: 8px; border: 3px dashed var(--rc); background: color-mix(in srgb, var(--rc) 22%, transparent); animation: rmBadgeIn .45s cubic-bezier(.3,1.6,.5,1) both; }
  .room-head h3 { color: var(--ink); }
  .btn.sec.on { background: var(--accent); color: var(--accent-ink); }
  .room-tip { font-size: 13px; color: var(--mark); margin: 0; }
  .room-list { display: flex; flex-direction: column; gap: 3px; }
  .room-item { display: grid; grid-template-columns: 6px 1fr; column-gap: 8px; text-align: left; border: 1px solid var(--rule); background: var(--sheet-2); border-radius: 4px; padding: 5px 8px; cursor: pointer; color: var(--ink); }
  .room-item i { grid-row: span 2; background: var(--tc); border-radius: 2px; }
  .room-item b { font-size: 14px; } .room-item span { font-size: 12px; color: var(--pencil); }
  .room-item:hover { background: var(--accent-soft); }
  .room-sug { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin: 8px 0; }
  .rs-h { width: 100%; font-size: 12px; color: var(--pencil); text-transform: uppercase; letter-spacing: .05em; }
  .room-chip { border: 1px solid var(--rule-strong); background: var(--sheet-2); color: var(--ink); border-radius: 999px; padding: 4px 10px; font-size: 13px; cursor: pointer; }
  .room-chip small { color: var(--pencil); font-size: 12px; }
  .room-chip.arch { border-color: var(--accent); color: var(--accent); }
  .room-chip:hover { background: var(--accent-soft); }
  .room-cols { display: inline-flex; gap: 6px; flex-wrap: wrap; }
  .room-col { width: 28px; height: 28px; border-radius: 50%; border: 3px solid transparent; background: var(--rc); cursor: pointer; box-shadow: 0 0 0 1px var(--rule-strong); transition: transform .2s; }
  .room-col.on { border-color: var(--sheet); box-shadow: 0 0 0 3px var(--rc); transform: scale(1.1); }
  .room-field select { font-weight: 800; }
  .room-pick { font-size: 13px; }
  .rm-room-tag { color: var(--accent); }
  .tb-rooms { color: var(--pencil); }

  /* ---------- catalogue books in two rows + per-item pictures ---------- */
  .cat-books { grid-template-columns: repeat(var(--cb-cols, 9), minmax(0, 1fr)); padding: 8px 14px; gap: 5px; }
  .cat-books .cat-book { min-height: 44px; }
  .cat-books .cb-name { font-size: 12px; line-height: 1.15; }
  .cat-books .cb-meta { font-size: 11px; }
  @media (max-width: 1250px) { .cat-books { grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); } }
  .item-img { display: block; width: 100%; padding: 0; border: 1px solid var(--rule-strong); border-radius: 6px; background: #fff; overflow: hidden; cursor: zoom-in; position: relative; }
  .item-img img { display: block; width: 100%; height: 100%; object-fit: contain; animation: fadeIn .3s; }
  .item-img.loading { min-height: 80px; display: grid; place-items: center; }
  .item-img .ii-load .mini-draw { width: 30px; height: 30px; }
  .item-img.ci-img { height: 150px; margin: 6px 0; }
  .item-img.insp-img { height: 220px; }
  .item-img:hover { box-shadow: 0 0 0 2px var(--accent); }
  .ci-also { font-size: 12px; color: var(--pencil); margin-top: 2px; }

  /* ---------- print button + print loader ---------- */
  .print-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
  .print-btn .pb-paper { transition: transform .3s; }
  .print-btn:hover .pb-paper { transform: translateY(2px); }
  .pr-ic { display: inline-block; width: 0; }
  .print-anim { width: 70px; height: 70px; overflow: visible; }
  .print-anim path, .print-anim circle { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .print-anim .pa-body { fill: var(--sheet); }
  .print-anim .pa-paper path:first-child { fill: #fff; }
  .print-anim .pa-paper { animation: paFeed 1.6s ease-in-out infinite; }
  .print-anim .pa-led { fill: var(--accent); stroke: none; animation: paLed .8s steps(2) infinite; }
  @keyframes paFeed { 0% { transform: translateY(-10px); opacity: 0; } 30% { opacity: 1; } 70% { transform: translateY(2px); opacity: 1; } 100% { transform: translateY(4px); opacity: 0; } }
  @keyframes paLed { 50% { opacity: .2; } }
  .panel-busy.ok .pb-print { display: none; }

  /* ---------- the A4 print (only visible when printing) ---------- */
  #printRoot { display: none; }
  @page { size: A4 portrait; margin: 11mm 10mm 13mm;
    @bottom-right { content: "page " counter(page) " / " counter(pages); font: 800 8.5pt Sarabun, sans-serif; color: #555; } }
  @page planpage { size: A4 landscape; margin: 8mm 9mm 11mm; }
  @media print {
    html, body { height: auto !important; overflow: visible !important; background: #fff !important; color: #000 !important; }
    body > *:not(#printRoot) { display: none !important; }
    #printRoot { display: block !important; font-family: "Sarabun", sans-serif; color: #111; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
  #printRoot * { font-weight: 700 !important; }
  #printRoot b, #printRoot h1, #printRoot h2, #printRoot h3, #printRoot .pr-model, #printRoot .pr-rno, #printRoot th { font-weight: 800 !important; }
  .pr-plan { page: planpage; height: 188mm; display: flex; flex-direction: column; gap: 3mm; break-after: page; }
  .pr-tb { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2.5px solid #111; padding-bottom: 2mm; }
  .pr-eyebrow { font-size: 9pt; letter-spacing: .08em; text-transform: uppercase; color: #b4492f; }
  .pr-tb h1 { margin: 0; font-size: 22pt; line-height: 1.1; }
  .pr-tb-r { display: flex; gap: 6mm; align-items: baseline; font-size: 10pt; flex-wrap: wrap; justify-content: flex-end; }
  .pr-tb-r b { font-size: 16pt; }
  .pr-meta { width: 100%; text-align: right; color: #444; font-size: 9pt; }
  .pr-planbox { flex: 1; min-height: 0; border: 1px solid #999; }
  .pr-svg { width: 100%; height: 100%; display: block; }
  .pr-legend { display: flex; flex-wrap: wrap; gap: 2mm 6mm; font-size: 8.5pt; align-items: center; color: #222; }
  .pr-legend i { display: inline-grid; place-items: center; font-style: normal; vertical-align: middle; margin-right: 1.5mm; }
  .pl-no { width: 5.5mm; height: 5.5mm; border: 1.5px solid #111; border-radius: 50%; font-size: 7.5pt; }
  .pl-r { padding: 0 1.4mm; height: 5mm; border-radius: 3mm 3mm 3mm 0; background: #2f6fb0; color: #fff; font-size: 7.5pt; }
  .pl-room { width: 7mm; height: 4mm; border: 1.5px dashed #d9822b; background: rgba(217,130,43,.15); }
  .pl-est { width: 7mm; height: 4mm; border: 1.5px dashed #111; }
  .pr-rooms { flex-basis: 100%; color: #333; }
  .pr-room { break-before: page; }
  .pr-plan + .pr-room { break-before: auto; }
  .pr-rh { display: flex; align-items: center; gap: 3mm; border-bottom: 2.5px solid var(--rc); padding-bottom: 2mm; margin-bottom: 3mm; }
  .pr-rdot { width: 6mm; height: 6mm; border-radius: 1.5mm; border: 2px dashed var(--rc); background: color-mix(in srgb, var(--rc) 22%, #fff); flex: none; }
  .pr-rh h2 { margin: 0; font-size: 18pt; }
  .pr-rmeta { margin-left: auto; font-size: 9pt; color: #444; text-align: right; }
  .pr-table { width: calc(100% - 2px); border-collapse: collapse; font-size: 9.5pt; }
  .pr-table th { background: #f0ede6; border: 1px solid #999; padding: 1.5mm; text-align: left; font-size: 8.5pt; text-transform: uppercase; letter-spacing: .04em; }
  .pr-table td { border: 1px solid #999; padding: 1.8mm; vertical-align: top; }
  .pr-table tr { break-inside: avoid; page-break-inside: avoid; }
  .pr-table thead { display: table-header-group; }
  .c-no { width: 11mm; text-align: center; font-size: 12pt; }
  .c-pic { width: 46mm; }
  .c-size { width: 26mm; } .c-qty { width: 11mm; text-align: center; font-size: 12pt; }
  .pr-pic { width: 44mm; height: 38mm; display: grid; place-items: center; background: #fff; position: relative; overflow: hidden; }
  /* round 30: sizes in mm, not %: a % max-height does not resolve inside the grid cell, so tall (portrait) pictures overflowed and lost their bottom */
  .pr-pic img { max-width: 44mm; max-height: 38mm; width: auto; height: auto; object-fit: contain; display: block; }
  .pr-pic.is-page img { max-height: 34mm; }
  .pr-picnote { position: absolute; bottom: 0; left: 0; right: 0; font-size: 6.5pt; color: #666; text-align: center; background: rgba(255,255,255,.85); }
  .pr-nopic { font-size: 8pt; color: #999; }
  .pr-model { font-size: 13pt; line-height: 1.15; }
  .pr-en { font-size: 9.5pt; }
  .pr-cn { font-size: 11pt; font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", "Sarabun", sans-serif; }
  .pr-sub { font-size: 8pt; color: #555; }
  .pr-fin { font-size: 8.5pt; margin-top: 1mm; padding-top: 1mm; border-top: 1px dashed #bbb; }
  .pr-file { font-size: 9pt; font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", "Sarabun", sans-serif; overflow-wrap: anywhere; }
  .pr-empty { color: #666; font-size: 10pt; }
  .pr-h3 { font-size: 12pt; margin: 5mm 0 2mm; border-bottom: 1px solid #999; }
  .pr-rm { border: 1px solid #999; border-left: 4px solid var(--rc); padding: 2mm 3mm; margin-bottom: 2.5mm; break-inside: avoid; font-size: 10pt; }
  .pr-rm-h { display: flex; gap: 2mm; align-items: baseline; flex-wrap: wrap; }
  .pr-rno { background: var(--rc); color: #fff; border-radius: 3mm 3mm 3mm 0; padding: 0 1.6mm; font-size: 9pt; }
  .pr-by { margin-left: auto; color: #555; font-size: 8.5pt; }
  .pr-rm-t p, .pr-rep p { margin: 1mm 0; }
  .pr-rep { margin: 1.5mm 0 0 5mm; padding-left: 2mm; border-left: 2px solid #ccc; font-size: 9pt; }
  .pr-photos { display: flex; gap: 2mm; flex-wrap: wrap; margin-top: 1.5mm; }
  .pr-ph img { height: 26mm; width: auto; border: 1px solid #bbb; display: block; }

  /* ---------- top bar in two rows, never a scroll bar (user, round 23) ---------- */
  .app { grid-template-rows: auto 1fr; }
  .topbar { flex-wrap: wrap; row-gap: 6px; padding: 6px 12px; min-height: 54px; overflow: visible !important; }
  .floor-tabs { flex-wrap: wrap; overflow: visible !important; }
  /* row 1: home, house, floors, catalogue, floor tabs ... save state + user; row 2: views and tools */
  .tb-break { display: block; flex-basis: 100%; height: 0; order: 2; }
  .tb-break ~ * { order: 3; }
  .topbar .save-state, .topbar .dropdown:has(#btnUser) { order: 1; }
  .topbar .spacer { order: 0; }
  .tools, .seg, .undo-grp { flex-wrap: wrap; }
  .topbar .menu { position: fixed; }   /* closed menus must not widen the page now that the bar no longer scrolls */
  /* with two rows there is room for the words again */
  @media (min-width: 1300px) {
    .brand-text { display: inline; }
    .sheets-btn span, .dist-btn span, .layers-btn span, .cat-btn span { display: inline; }
    .sheets-btn, .dist-btn, .layers-btn, .cat-btn { padding: 5px 10px; }
    .topbar .save-state { display: inline-block; }
  }
  /* phones keep one row that you swipe sideways (two rows would cover a third of the plan); no scroll bar shown */
  @media (max-width: 860px) {
    .app { grid-template-rows: 54px 1fr; }
    .topbar { flex-wrap: nowrap; padding: 0 12px; overflow-x: auto !important; overflow-y: hidden !important; scrollbar-width: none; }
    .topbar::-webkit-scrollbar { display: none; }
    .tb-break { display: none; }
    .tb-break ~ *, .topbar .save-state, .topbar .dropdown:has(#btnUser) { order: 0; }
    .floor-tabs { flex-wrap: nowrap; }
  }
  @media (max-width: 860px) {
    .sidebar { top: var(--top-h, 54px) !important; }
    .cust-panel { top: var(--top-h, 54px) !important; }
  }

  /* ---------- top bar: two centred rows of grouped controls (user, round 24) ---------- */
  .topbar { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 0 10px; padding: 8px 14px 9px; }
  .tbar-mid { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
  .topbar > .g-brand { padding-left: 0; }
  .topbar > .g-user { padding-right: 0; border-left: 0; flex-direction: column; align-items: flex-end; gap: 3px; }
  .tbar-row > .tb-grp:first-child { border-left: 0; }
  .topbar .brand-text { font-size: 21px; }
  .tbar-row { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; row-gap: 7px; min-width: 0; }
  .tb-grp { display: flex; align-items: center; gap: 6px; padding: 0 12px; }
  .tb-grp + .tb-grp { border-left: 1px dashed var(--rule-strong); }
  .tb-grp .tools, .tb-grp .seg, .tb-grp .undo-grp, .tb-grp .zoom, .tb-grp .plan-rot { flex-wrap: nowrap; }
  .tb-grp .floor-tabs { flex-wrap: wrap; justify-content: center; }
  .topbar .spacer, .topbar .tb-break { display: none !important; }
  body.mode-iso .g-tools, body.mode-iso .g-edit { display: none; }
  /* one height for every control so both rows line up */
  .topbar .btn-ghost, .topbar .icon-btn, .topbar .seg-btn, .topbar .tool, .topbar .floor-tab, .topbar .user-chip, .topbar #selHouse, .topbar .cat-btn {
    min-height: 34px; box-sizing: border-box; }
  .topbar .btn-ghost, .topbar .icon-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .topbar .icon-btn { min-width: 34px; }
  .print-btn span, .theme-btn span { display: inline; }
  .theme-btn svg { width: 19px; height: 19px; stroke-width: 1.6; }
  /* the Furniture Catalogue button: its own warm colour so it is easy to find */
  .topbar .cat-btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 16px 0 12px;
    border: 0; border-radius: 999px; color: #fff; font-size: 15px; letter-spacing: .02em; white-space: nowrap; cursor: pointer;
    background: linear-gradient(135deg, #a8392a 0%, #d0662f 45%, #e8a93a 100%); box-shadow: 0 3px 10px rgba(168, 57, 42, .35), inset 0 1px 0 rgba(255,255,255,.35);
    transition: transform .2s, box-shadow .2s, filter .2s; }
  .topbar .cat-btn span { display: inline !important; }
  .topbar .cat-btn svg { width: 21px; height: 21px; stroke: #fff; }
  .topbar .cat-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(168, 57, 42, .45), inset 0 1px 0 rgba(255,255,255,.35); filter: saturate(1.1); }
  .topbar .cat-btn::after { content: ""; position: absolute; top: 0; bottom: 0; left: -40%; width: 30%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent);
    transform: skewX(-20deg) translateX(0); animation: catShine 4.5s ease-in-out infinite; pointer-events: none; }
  @keyframes catShine { 0%, 70% { transform: skewX(-20deg) translateX(0); } 100% { transform: skewX(-20deg) translateX(560%); } }
  body.blueprint .topbar .cat-btn { color: #0d2d54; background: linear-gradient(135deg, #ffd56a 0%, #ffb46a 50%, #ff8f7a 100%); box-shadow: 0 3px 12px rgba(255, 180, 90, .35); }
  body.blueprint .topbar .cat-btn svg { stroke: #0d2d54; }
  .topbar .only-narrow { display: none; }
  @media (max-width: 1450px) {
    /* the name stays on the left: stacked on two short lines instead of hidden */
    .topbar .brand-text { display: inline-flex !important; flex-direction: column; align-items: flex-start; line-height: 1.02; font-size: 15px; }
    .topbar .brand-text .bt-yr { font-size: 12px; letter-spacing: .14em; opacity: .75; }
    .tb-grp { padding: 0 7px; }
    .topbar .dist-btn span, .topbar .layers-btn span { display: none !important; }
    .topbar .dist-btn, .topbar .layers-btn { padding: 0 8px; }
  }
  @media (max-width: 1200px) {
    .tb-grp { padding: 0 5px; }
    .topbar .tool, .topbar .seg-btn { padding-left: 7px; padding-right: 7px; }
    .topbar .print-btn, .topbar .theme-btn { padding: 0 8px; }
  }
  @media (max-width: 1150px) {
    .topbar .brand-text { display: none !important; }   /* small laptops: the house icon alone */
    .tb-grp { padding: 0 4px; gap: 4px; }
    .topbar .tool, .topbar .seg-btn { font-size: 12px; padding-left: 6px; padding-right: 6px; }
    .topbar .print-btn, .topbar .theme-btn { font-size: 12px; padding: 0 6px; gap: 4px; }
    .topbar .icon-btn { min-width: 30px; padding: 0 5px; }
  }
  /* phones: one row you swipe sideways (groups flatten into it) */
  @media (max-width: 860px) {
    .topbar .only-narrow { display: inline-flex; }
    .topbar { display: flex; flex-direction: row; align-items: center; gap: 8px; padding: 0 12px; }
    .tbar-mid, .tbar-row, .tb-grp, .topbar > .g-user { display: contents; }
    .topbar .brand-text { display: none !important; }
    .topbar .cat-btn { font-size: 14px; }
  }
  /* ---------- speed (round 25): nothing animates where it cannot be seen ---------- */
  /* the welcome page and the loading screen fade out but stay in the page; their endless animations
     (render slideshow, compass, loader lines and dots) kept the browser repainting behind the plan */
  .hidden, .hidden * { animation-play-state: paused !important; }
  /* top bar touches play a few times, then rest (they replay when you point at them) */
  body.ready .bm-smoke circle { animation-iteration-count: 3; }
  body.ready .bm-door-g { animation-iteration-count: 3; }
  body.ready.working .bm-smoke circle, body.working .bm-smoke circle,
  body.ready.working .bm-door-g, body.working .bm-door-g { animation-iteration-count: infinite; }
  .brand:hover .bm-smoke circle { animation: smoke 1.8s ease-out 2; }
  .topbar .cat-btn::after { animation-iteration-count: 3; }
  .topbar .cat-btn:hover::after { animation: catShine 1.6s ease-in-out 1; }
  .dist-btn[aria-pressed="true"] .d-dot { animation-iteration-count: 3; }
  .dist-btn[aria-pressed="true"]:hover .d-dot { animation: distDot 2.4s ease-in-out infinite; }
  /* ---------- round 26: catalogue page keeps room under the zoom bar; compact book tabs on short screens ---------- */
  /* the picture sits inside margins (same numbers as PAD in zoomView): 10 px round it, 68 px free at the bottom for the zoom bar */
  .zv-img { position: absolute; left: 10px; top: 10px; width: calc(100% - 20px); height: calc(100% - 10px - var(--zv-pb, 68px)); max-width: none; max-height: none; }
  /* a 15" laptop at 150% (about 1280 x 650 inside the browser): book tabs, title and search take less height */
  @media (max-height: 900px) and (min-width: 861px) {
    .cat-head { padding: 6px 14px; gap: 10px; }
    .cat-head .eyebrow { font-size: 10px; }
    .cat-title h2 { font-size: 20px; }
    #catQ { padding: 5px 10px; }
    .cat-books { padding: 5px 12px; gap: 4px; }
    .cat-books .cat-book { min-height: 32px; padding: 2px 6px 2px 3px; grid-template-rows: 1fr; column-gap: 4px; border-bottom-width: 2px; }
    .cat-books .cb-letter { grid-row: 1; font-size: 19px; width: 18px; }
    .cat-books .cb-name { font-size: 11px; line-height: 1.1; }
    .cat-books .cb-meta { display: none; }   /* pages and item count stay in the tab's hover note */
    .fav-book .cb-letter .heart { width: 18px; height: 18px; }
    .cat-bar { padding: 5px 12px; }
  }
  /* ---------- Refresh button after Layers (round 26) ---------- */
  .refresh-btn { display: inline-flex; align-items: center; gap: 6px; }
  .refresh-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transition: transform .35s; }
  .refresh-btn:hover svg { transform: rotate(-60deg); }
  .refresh-btn.spinning svg { animation: spin .8s linear infinite; }
  .refresh-btn:disabled { opacity: 1; cursor: progress; }
  @media (max-width: 1600px) { .topbar .refresh-btn span { display: none; } .topbar .refresh-btn { padding: 0 8px; } }
  /* ---------- top bar fit steps (round 27): App.html adds tc1..tc4 one at a time until both rows fit on one line ---------- */
  .topbar.tc1 .ft-word { display: none; }                       /* "3rd Floor" -> "3rd" (full name in the tooltip) */
  .topbar.tc1 .floor-tab { padding-left: 12px; padding-right: 12px; }
  .topbar.tc1 .dist-btn span, .topbar.tc1 .layers-btn span, .topbar.tc1 .refresh-btn span { display: none !important; }
  .topbar.tc1 .dist-btn, .topbar.tc1 .layers-btn, .topbar.tc1 .refresh-btn { padding: 0 8px; }
  .topbar.tc1 .tb-grp { padding: 0 8px; }
  .topbar.tc2 .print-btn span, .topbar.tc2 .theme-btn span { display: none; }
  .topbar.tc2 .print-btn, .topbar.tc2 .theme-btn { padding: 0 8px; }
  .topbar.tc2 .cat-btn { font-size: 14px; padding: 0 13px 0 10px; gap: 6px; }
  .topbar.tc2 .brand-text { display: inline-flex !important; flex-direction: column; align-items: flex-start; line-height: 1.02; font-size: 15px; }
  .topbar.tc2 .brand-text .bt-yr { font-size: 12px; letter-spacing: .14em; opacity: .75; }
  .topbar.tc3 .tb-grp { padding: 0 5px; gap: 4px; }
  .topbar.tc3 .tool, .topbar.tc3 .seg-btn { font-size: 12px; padding-left: 6px; padding-right: 6px; }
  .topbar.tc3 .icon-btn { min-width: 30px; padding: 0 5px; }
  .topbar.tc3 .floor-tab { font-size: 14px; padding-left: 9px; padding-right: 9px; }
  .topbar.tc3 #selHouse { max-width: 100px; }
  .topbar.tc3 .brand-text { display: none !important; }
  .topbar.tc4 .cat-btn .cb-word b { display: none; }             /* "Furniture Catalogue" -> "Catalogue" */
  .topbar.tc4 .tb-grp { padding: 0 3px; }
  .topbar.tc4 .floor-tab { font-size: 13px; padding-left: 7px; padding-right: 7px; }
  .topbar.tc4 .tool, .topbar.tc4 .seg-btn { letter-spacing: .02em; padding-left: 5px; padding-right: 5px; }
  /* ---------- Dark theme (round 27): body.blueprint.dark = every blueprint rule (light ink on a dark sheet) + charcoal tokens ---------- */
  body.blueprint.dark {
    --paper: #17191c; --sheet: #202327; --sheet-2: #1a1d20; --canvas: #121416;
    --ink: #eef1f5; --pencil: #a3aab5; --rule: rgba(255, 255, 255, .11); --rule-strong: rgba(255, 255, 255, .25);
    --accent: #7cc4f0; --accent-ink: #111418; --accent-soft: rgba(124, 196, 240, .14);
    --mark: #ffb35c; --warn: #ffc27a; --danger: #ff8f80;
    --grid: rgba(255, 255, 255, .035); --shadow: 0 10px 30px rgba(0, 0, 0, .55);
    --label-ink: #ffd98a; --custom: #ffcf5a; --custom-soft: rgba(255, 207, 90, .12);
    --fav: #ff8fa3; --fav-hatch: rgba(17, 20, 24, .5); --fav-soft: rgba(255, 143, 163, .12);
  }
  body.blueprint.dark select option { background: #202327; }
  body.blueprint.dark .fav-book.active, body.blueprint.dark .fav-book.active .heart, body.blueprint.dark .fav-book.active .cb-meta { color: #111418; }
  body.blueprint.dark .topbar .cat-btn { color: #fff; background: linear-gradient(135deg, #a8392a 0%, #d0662f 45%, #e8a93a 100%); box-shadow: 0 3px 12px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255,255,255,.25); }
  body.blueprint.dark .topbar .cat-btn svg { stroke: #fff; }
  body.blueprint.dark .seg-btn.active { color: #111418; }
  body.blueprint.dark .floor-tab.active { background: var(--ink); color: #111418; }
  /* theme chooser menu */
  .theme-menu { min-width: 250px; }
  .theme-opt { display: grid !important; grid-template-columns: 34px 1fr 16px; align-items: center; gap: 10px; }
  .theme-opt span { display: flex; flex-direction: column; line-height: 1.2; }
  .theme-opt small { color: var(--pencil); font-size: 11.5px; }
  .theme-opt.on { background: var(--accent-soft); }
  .th-tick { font-style: normal; color: var(--accent); text-align: center; }
  .th-sw { position: relative; width: 34px; height: 26px; border-radius: 4px; border: 1px solid var(--rule-strong); overflow: hidden; display: block; }
  .th-sw b { position: absolute; left: 6px; top: 6px; width: 20px; height: 12px; border: 2px solid; border-radius: 1px; }
  .th-paper { background: #fbf8ef linear-gradient(rgba(35,64,122,.12) 1px, transparent 1px) 0 0 / 6px 6px; } .th-paper b { border-color: #1e2633; }
  .th-blueprint { background: #14467e linear-gradient(rgba(255,255,255,.12) 1px, transparent 1px) 0 0 / 6px 6px; } .th-blueprint b { border-color: #f4f8ff; }
  .th-dark { background: #24272c linear-gradient(rgba(255,255,255,.08) 1px, transparent 1px) 0 0 / 6px 6px; } .th-dark b { border-color: #e8ebf0; }
  .theme-opt:hover .th-sw b { transform: translate(1px, -1px); transition: transform .2s; }
  /* ---------- who added a piece (round 30): panel line + hover card on the plan ---------- */
  .who-line { display: flex; gap: 6px; align-items: flex-start; font-size: 13px; color: var(--ink); line-height: 1.35; margin-top: -2px; }
  .who-line.muted { color: var(--pencil); font-size: 12px; }
  .who-line b { font-weight: 800; }
  .who-ic { width: 15px; height: 15px; flex: none; margin-top: 1px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; opacity: .75; }
  .piece-tip { position: absolute; left: 0; top: 0; z-index: 7; max-width: 300px; pointer-events: none; opacity: 0; transition: opacity .15s;
    display: flex; flex-direction: column; gap: 2px; padding: 7px 10px 8px; border-radius: 6px; background: var(--sheet); color: var(--ink);
    border: 1px solid var(--rule-strong); border-top: 3px solid var(--accent); box-shadow: var(--shadow); font-size: 13px; }
  .piece-tip.on { opacity: 1; }
  .piece-tip > b { font-size: 14px; }
  .piece-tip .pt-sub { font-size: 12px; color: var(--pencil); }
  .piece-tip .who-line { margin-top: 3px; font-size: 12px; }

  /* ---------- round 33: size badge in the model, English for printed Chinese, factory colours ---------- */
  .vtag { display: inline-block; vertical-align: 1px; margin-left: 3px; padding: 1px 7px; border-radius: 999px; font-size: .78em; line-height: 1.35;
    background: var(--mark); color: #fff; letter-spacing: .02em; white-space: nowrap; }
  body.blueprint .vtag { background: #ffcf5a; color: #0d2d54; }
  h3 .vtag { font-size: .7em; vertical-align: 3px; }
  .cn { font-size: .82em; color: var(--pencil); margin-left: 3px; }
  .en-tr { border-bottom: 1px dotted var(--rule-strong); cursor: help; }
  .fc-row { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin-top: 4px; }
  .fc-row .fc-l, .fc-pick .fc-l { font-size: 12px; color: var(--pencil); margin-right: 2px; }
  .fc-chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px 2px 4px; border: 1px solid var(--rule-strong); border-radius: 999px;
    background: var(--sheet); color: var(--ink); font: inherit; font-size: 12px; line-height: 1.3; }
  .fc-chip i { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(0, 0, 0, .25); flex: none; }
  .fc-chip b { font-size: 12px; }
  button.fc-chip { cursor: pointer; }
  button.fc-chip:hover { border-color: var(--accent); background: var(--accent-soft); }
  .fc-chip.on { border-color: var(--mark); box-shadow: 0 0 0 2px var(--mark) inset; background: var(--accent-soft); }
  body.blueprint .fc-chip.on { border-color: #ffcf5a; box-shadow: 0 0 0 2px #ffcf5a inset; }
  .fc-pick { margin: 8px 0; padding: 8px 10px; border: 1px dashed var(--rule-strong); border-radius: var(--radius); }
  .kv .fc-row { margin-top: 0; }
  .kv .fc-row .fc-l { display: none; }
</style>

</head>

        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="1.5"/><path d="M3.5 9.5h17M3.5 15h17M9.5 3.5v17M15 3.5v17"/></svg>

  // ---------------- refresh this floor (user, round 26) ----------------
  // Someone else may be working on the same floor: load their furniture, rooms, name tags and remarks without leaving
  // the floor. Own changes are saved first (flush); the view (zoom, turn, 2D / 3/4) and the selection stay as they are.
  function placeKey(p) { return [Math.round(p.x), Math.round(p.y), Math.round(p.rot || 0), p.itemId, p.w, p.d, p.label, p.color, p.fin || '', p.locked ? 1 : 0, p.mat || '', p.room || '', JSON.stringify(p.points || '')].join('|'); }
  function refreshFloor() {
    if (!S.floor || S.landingOpen || S.loadingFloor || S.refreshing) return;
    var btn = $('btnRefresh');
    var go = function () {
      var id = S.floor.id, oldRev = S.rev, before = {};
      S.placements.forEach(function (p) { before[p.id] = placeKey(p); });
      S.refreshing = true; btn.classList.add('spinning'); btn.disabled = true;
      var plP = callAs(['Checking this floor for changes'], 'apiGetPlacements', [id]);
      var rmP = rmEditDirty() ? Promise.resolve(null) : callAs(false, 'apiGetRemarks', [id]).catch(function () { return null; });
      var rmKey = function (x) { return [x.id, x.upAt || '', (x.text || '').length, Math.round(x.x), Math.round(x.y), x.placementId, x.locked ? 1 : 0, (x.photos || []).length, x.roomId || ''].join('|'); };
      var rmBefore = RM.list.map(rmKey).sort().join(',');
      Promise.all([plP, rmP]).then(function (res) {
        if (!S.floor || S.floor.id !== id) return;
        var r = res[0] || {}, list = r.placements || [], after = {}, added = 0, moved = 0, removed = 0;
        list.forEach(function (p) { after[p.id] = placeKey(p); if (!(p.id in before)) added++; else if (before[p.id] !== after[p.id]) moved++; });
        Object.keys(before).forEach(function (k) { if (!(k in after)) removed++; });
        var changed = added + moved + removed > 0 || String(r.rev || '0') !== String(oldRev);
        if (changed && !S.dirty) {
          S.placements = list; S.rev = r.rev || '0'; S.floor.rev = S.rev; S.segs = null;
          delete HIST.byFloor[id]; histReset();             // others' changes: the old undo steps no longer apply
          if (S.sel && !findP(S.sel)) S.sel = null;
          renderFurniture(); renderInspector(); updateTitleBlock();
          if (S.view === 'iso') rebuildIso();
        }
        var rmMsg = '';
        if (res[1]) {
          var rmAfter = res[1].map(rmKey).sort().join(',');
          RM.loadedAt = Date.now(); rmApply(res[1], true);
          if (rmAfter !== rmBefore) rmMsg = 'remarks updated';
        }
        if (changed && S.dirty) { toast('You changed something while it was checking. Your change is saving; press Refresh again after.', 4500); return; }
        var parts = [];
        if (added) parts.push(added + ' added'); if (moved) parts.push(moved + ' changed'); if (removed) parts.push(removed + ' removed');
        if (rmMsg) parts.push(rmMsg);
        var who = r.revBy && S.me && r.revBy.toLowerCase() !== String(S.me.email).toLowerCase() ? ' (last saved by ' + r.revBy.split('@')[0] + ')' : '';
        toast(parts.length ? 'Floor refreshed: ' + parts.join(', ') + who + '.'
                           : 'Already up to date: nothing new on this floor.', parts.length ? 4200 : 2600);
      }).catch(function (e) {
        toast('Could not refresh: ' + errMsg(e) + '. Try again in a moment.', 5000);
      }).then(function () {
        S.refreshing = false; btn.classList.remove('spinning'); btn.disabled = false;
      });
    };
    flush(go, 'refreshing');
  }
